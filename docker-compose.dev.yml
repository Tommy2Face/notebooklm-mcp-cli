version: '3.9'

services:
  notebooklm-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: notebooklm-mcp-dev
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
